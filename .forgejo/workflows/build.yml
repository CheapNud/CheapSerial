name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ master ]

env:
  DOTNET_VERSION: '11.0.x'
  DOTNET_QUALITY: 'preview'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore CheapSerial.slnx

      - name: Build
        run: dotnet build CheapSerial.slnx --configuration Release --no-restore
